<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LandGrab</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>

  <!-- HOME SCREEN -->
  <div id="screen-home" class="screen active">
    <div class="title-block">
      <h1>LANDGRAB</h1>
      <p class="subtitle">14th Century Europe — Colonize. Develop. Dominate.</p>
    </div>
    <div class="menu">
      <button class="menu-btn" id="btn-new-game">New Game</button>
      <button class="menu-btn" id="btn-load-game">Load Game</button>
    </div>
  </div>

  <!-- NEW GAME SCREEN -->
  <div id="screen-new-game" class="screen">
    <h2>New Game</h2>
    <form id="form-new-game">
      <label>Lord's Name
        <input type="text" id="input-name" placeholder="e.g. Edmund of York" required />
      </label>
      <label>Map Width <span class="hint">(10–100)</span>
        <input type="number" id="input-width" value="40" min="10" max="100" />
      </label>
      <label>Map Height <span class="hint">(10–80)</span>
        <input type="number" id="input-height" value="30" min="10" max="80" />
      </label>
      <label>Seed <span class="hint">(leave blank for random)</span>
        <input type="number" id="input-seed" placeholder="random" />
      </label>
      <div class="form-actions">
        <button type="submit" class="menu-btn">Begin</button>
        <button type="button" class="menu-btn secondary" id="btn-back-home">Back</button>
      </div>
    </form>
  </div>

  <!-- LOAD GAME SCREEN -->
  <div id="screen-load-game" class="screen">
    <h2>Load Game</h2>
    <div id="save-list"></div>
    <button class="menu-btn secondary" id="btn-back-home-2">Back</button>
  </div>

  <!-- GAME SCREEN -->
  <div id="screen-game" class="screen">

    <!-- Left: map + log -->
    <div id="game-left">
      <canvas id="map-canvas"></canvas>
      <div id="message-log"></div>
    </div>

    <!-- Right: sidebar -->
    <div id="sidebar">

      <div class="sidebar-section" id="sidebar-lord">
        <div id="hud-name" class="lord-name"></div>
        <div class="hud-row"><span class="hud-label">Turn</span><span id="hud-turn">1</span></div>
        <div class="hud-row"><span class="hud-label">Position</span><span id="hud-pos">—</span></div>
        <div class="hud-row"><span class="hud-label">Gold</span><span id="hud-gold">100</span></div>
      </div>

      <div class="sidebar-section" id="sidebar-dice">
        <div class="section-label">MOVEMENT</div>

        <div id="dice-roll-area">
          <button id="btn-roll-die" class="die-btn" title="Click to roll">
            <svg id="die-svg" viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg">
              <polygon points="30,4 56,20 56,40 30,56 4,40 4,20" class="die-hex"/>
              <text id="die-face" x="30" y="37" text-anchor="middle" class="die-text">d8</text>
            </svg>
          </button>
          <div id="dice-prompt">Roll to begin your turn</div>
        </div>

        <div id="move-info" class="hidden">
          <div class="move-bar-wrap">
            <div class="move-bar-label">
              <span id="move-remaining">0</span>
              <span class="move-sep">/</span>
              <span id="move-total">0</span>
              <span class="move-unit">MP</span>
            </div>
            <div class="move-bar-track">
              <div id="move-bar-fill"></div>
            </div>
          </div>
          <div class="move-hint">Click a tile to move</div>
        </div>
      </div>

      <div class="sidebar-spacer"></div>

      <div class="sidebar-section" id="sidebar-end">
        <button id="btn-end-turn" class="end-turn-btn" disabled>End Turn</button>
      </div>

      <div class="sidebar-section" id="sidebar-modes">
        <div class="section-label">MAP MODE</div>
        <div id="map-mode-btns">
          <button class="mode-btn active" data-mode="terrain">Terrain</button>
          <button class="mode-btn" data-mode="elevation">Elevation</button>
        </div>
      </div>

    </div>
  </div>

  <!-- Tile tooltip (absolutely positioned, shown on hover) -->
  <div id="tile-tooltip" class="hidden">
    <div id="tt-terrain"></div>
    <div id="tt-owner"></div>
    <div id="tt-cost"></div>
  </div>

  <script src="/js/app.js"></script>
</body>
</html>
